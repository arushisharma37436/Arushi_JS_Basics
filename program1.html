<!DOCTYPE html>
<html>
<head>
    <title>Add Two Numbers</title>
</head>
<body>

<h1>Add Two Numbers</h1>

<script>
    let a = 10;
    let b = 20;

    let sum = a + b;

    document.write("First Number: " + a + "<br>");
    document.write("Second Number: " + b + "<br>");
    document.write("Sum: " + sum);
</script>

</body>
</html>
