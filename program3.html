<!DOCTYPE html>
<html>
<head>
    <title>Largest Number</title>
</head>
<body>

<h1>Find Largest Number</h1>

<script>
    let a = 25;
    let b = 45;
    let c = 30;

    let largest;

    if (a >= b && a >= c) {
        largest = a;
    } else if (b >= a && b >= c) {
        largest = b;
    } else {
        largest = c;
    }

    document.write("First Number: " + a + "<br>");
    document.write("Second Number: " + b + "<br>");
    document.write("Third Number: " + c + "<br>");
    document.write("Largest Number: " + largest);
</script>

</body>
</html>
