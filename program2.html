<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd</title>
</head>
<body>

<h1>Check Even or Odd</h1>

<script>
    let number = 15;

    document.write("Number: " + number + "<br>");

    if (number % 2 == 0) {
        document.write("The number is Even.");
    } else {
        document.write("The number is Odd.");
    }
</script>

</body>
</html>
